name: Publish image

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Weekly, so the base image's security fixes reach the published image
  # without waiting for somebody to have something to commit. Master only:
  # `latest` and nothing else moves.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  # The suite, before anything is published. Duplicated from ci.yml rather than
  # depended on across workflows: `workflow_run` does not block a publish, it
  # merely happens after one, which is the opposite of what is wanted here.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements.txt
      - run: ./run-tests.sh

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Built for two architectures because a homelab is as likely to be a
      # small ARM box as an x86 server, and GitHub's runners are only the
      # latter. An amd64-only image pushes cleanly and then refuses to start on
      # half the machines it was meant for. QEMU is what makes the arm64 half
      # possible here; it is slow, and it is the whole point.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only from master, so a tag pushed from a branch cannot
          # quietly become what everybody pulls.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
