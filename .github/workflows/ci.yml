name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matching the Dockerfile. A suite that passes on a version the image
          # does not run is not evidence about the image.
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements.txt
      - name: Run every test file
        # The same script a developer runs, so a green box and a green laptop
        # mean the same thing. No JELLYFIN_TOKEN here on purpose:
        # `tests/harness.py` sets every variable the app needs before
        # importing it, and a value supplied from outside would hide a test
        # file that forgot to call it.
        run: ./run-tests.sh
